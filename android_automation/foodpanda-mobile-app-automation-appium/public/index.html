<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shikho Test Runner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    .header h1 { font-size: 16px; font-weight: 600; color: #e6edf3; }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #21262d;
      color: #8b949e;
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    /* ── Buttons ── */
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-green  { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-green:hover:not(:disabled)  { background: #2ea043; }
    .btn-blue   { background: #1f6feb; border-color: #388bfd; color: #fff; }
    .btn-blue:hover:not(:disabled)   { background: #388bfd; }
    .btn-purple { background: #6f42c1; border-color: #8957e5; color: #fff; }
    .btn-purple:hover:not(:disabled) { background: #8957e5; }
    .btn-ghost  { background: #21262d; border-color: #30363d; color: #8b949e; }
    .btn-ghost:hover  { background: #30363d; }
    .btn-sm { padding: 3px 10px; font-size: 12px; }

    /* ── Layout ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Spec panel ── */
    .spec-panel {
      width: 310px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #30363d;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: #8b949e; font-weight: 600; }

    .spec-list { flex: 1; overflow-y: auto; padding: 6px; }
    .spec-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 2px;
      transition: background 0.1s;
    }
    .spec-item:hover { background: #161b22; }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
      background: #30363d;
      transition: background 0.3s;
    }
    .dot.running { background: #d29922; animation: pulse 0.9s ease-in-out infinite; }
    .dot.passed  { background: #3fb950; }
    .dot.failed  { background: #f85149; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .spec-name {
      flex: 1;
      font-size: 12.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Console ── */
    .console-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #console {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, monospace;
      font-size: 12px;
      line-height: 1.7;
      background: #090c10;
      white-space: pre-wrap;
      word-break: break-all;
      color: #8b949e;
    }

    .c-pass { color: #3fb950; }
    .c-fail { color: #f85149; }
    .c-info { color: #58a6ff; }
    .c-warn { color: #d29922; }

    /* ── Spinner ── */
    .spinner { display: none; align-items: center; gap: 7px; font-size: 12px; color: #d29922; }
    .spinner.on { display: flex; }
    .spin {
      width: 13px; height: 13px;
      border: 2px solid #d29922;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <h1>🧪 Shikho Test Runner</h1>
  <span class="badge" id="specCount">loading…</span>
  <div class="header-right">
    <div class="spinner" id="spinner"><div class="spin"></div><span id="spinLabel">Running…</span></div>
    <button class="btn btn-green" id="runAllBtn" onclick="runSpec(null)">▶&nbsp; Run All</button>
    <button class="btn btn-purple" id="reportBtn" style="display:none" onclick="openReport()">📊&nbsp; View Report</button>
  </div>
</div>

<div class="main">

  <!-- Spec list -->
  <div class="spec-panel">
    <div class="panel-header">
      <span class="panel-title">Test Specs</span>
    </div>
    <div class="spec-list" id="specList">Loading…</div>
  </div>

  <!-- Console output -->
  <div class="console-panel">
    <div class="panel-header">
      <span class="panel-title">Output</span>
      <button class="btn btn-ghost btn-sm" onclick="clearConsole()">Clear</button>
    </div>
    <div id="console">Ready. Select a spec or click Run All.\n</div>
  </div>

</div>

<script>
  let es = null;
  let specs = [];

  // ── Load specs ──────────────────────────────────────────────
  async function loadSpecs() {
    const res = await fetch('/api/specs');
    specs = await res.json();
    document.getElementById('specCount').textContent = `${specs.length} specs`;
    renderSpecs();
  }

  function renderSpecs() {
    document.getElementById('specList').innerHTML = specs.map((s, i) => `
      <div class="spec-item">
        <div class="dot" id="dot-${i}"></div>
        <span class="spec-name" title="${htmlEsc(s)}">${htmlEsc(s)}</span>
        <button class="btn btn-blue btn-sm spec-btn" data-idx="${i}" onclick="runSpec('${htmlEsc(s)}', ${i})">▶</button>
      </div>
    `).join('');
  }

  // ── Helpers ─────────────────────────────────────────────────
  function htmlEsc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function dot(idx, state) {
    const el = document.getElementById('dot-' + idx);
    if (el) el.className = 'dot' + (state ? ' ' + state : '');
  }

  function setRunning(yes, label) {
    document.getElementById('runAllBtn').disabled = yes;
    document.querySelectorAll('.spec-btn').forEach(b => b.disabled = yes);
    const sp = document.getElementById('spinner');
    sp.classList.toggle('on', yes);
    if (label) document.getElementById('spinLabel').textContent = label;
  }

  function colorLine(text) {
    const e = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (/✓|passing|\d+ passing/i.test(text))       return `<span class="c-pass">${e}</span>`;
    if (/✗|failing|\d+ failing|Error|failed/i.test(text)) return `<span class="c-fail">${e}</span>`;
    if (/running|spec\s|›|→|\[/i.test(text))        return `<span class="c-info">${e}</span>`;
    if (/warn/i.test(text))                          return `<span class="c-warn">${e}</span>`;
    return e;
  }

  function appendLog(text) {
    const el = document.getElementById('console');
    el.innerHTML += text.split('\n').map(colorLine).join('\n');
    el.scrollTop = el.scrollHeight;
  }

  function clearConsole() {
    document.getElementById('console').innerHTML = '';
  }

  function openReport() {
    window.open('/report/index.html', '_blank');
  }

  // ── Run ─────────────────────────────────────────────────────
  function runSpec(spec, specIdx) {
    if (es) { es.close(); es = null; }

    clearConsole();
    document.getElementById('reportBtn').style.display = 'none';

    // Reset / set dot states
    specs.forEach((_, i) => dot(i, spec === null ? 'running' : ''));
    if (spec !== null) dot(specIdx, 'running');

    const label = spec ? spec : 'all specs';
    setRunning(true, `Running ${label}`);
    appendLog(`▶  ${spec || 'All specs'}\n\n`);

    const url = spec ? `/api/run?spec=${encodeURIComponent(spec)}` : '/api/run';
    es = new EventSource(url);

    es.onmessage = ({ data }) => {
      const msg = JSON.parse(data);

      if (msg.type === 'log') {
        appendLog(msg.text);

      } else if (msg.type === 'generating') {
        appendLog('\n\n📊  Generating Allure report…\n');

      } else if (msg.type === 'done') {
        const ok = msg.exitCode === 0;
        const state = ok ? 'passed' : 'failed';

        if (spec !== null) {
          dot(specIdx, state);
        } else {
          specs.forEach((_, i) => dot(i, state));
        }

        appendLog(`\n${ok ? '✅  All passed' : '❌  Some tests failed'} (exit ${msg.exitCode})\n`);
        setRunning(false);
        document.getElementById('reportBtn').style.display = '';
        es.close();
      }
    };

    es.onerror = () => {
      appendLog('\n⚠️  Connection lost\n');
      setRunning(false);
      if (es) { es.close(); es = null; }
    };
  }

  loadSpecs();
</script>
</body>
</html>
